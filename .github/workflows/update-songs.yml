name: Update SP12 songs

on:
  workflow_dispatch:
  schedule:
    - cron: '15 18 * * *' # 日本時間 毎日03:15

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Fetch SP12 data
        run: python scripts/update_songs.py
      - name: Commit updated data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add songs.json
          git diff --cached --quiet || git commit -m "Update SP12 song data"
          git push
